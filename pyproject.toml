[project]
name = "digitalnomadagent"
version = "0.1.0"
description = "DigitalNomadAgent — Autonomous Evidence-Based Place Recommendation Agent"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "tenacity>=9.0",
    "Jinja2>=3.1",
    "Pillow>=11.0",  # dev-only: scripts/render_architecture.py
    "timezonefinder>=6.5",
    'tzdata>=2025.2; sys_platform == "win32"',
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in network/paid-provider checks; requires RUN_LIVE_TESTS=1"]
