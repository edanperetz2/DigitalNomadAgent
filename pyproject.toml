[project]
name = "digitalnomadagent"
version = "0.1.0"
description = "DigitalNomadAgent — Autonomous Evidence-Based Place Recommendation Agent"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in network/paid-provider checks; requires RUN_LIVE_TESTS=1"]
